name: CI

# Typecheck, lint and build on every push and pull request.
#
# This exists because six lint errors survived in `src/` for months: nothing
# ever ran the checks except by hand. Keeping it fast (no database, no
# deployment) is what keeps it from being skipped.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # A new push supersedes the run in progress for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # `prisma generate` needs a syntactically valid URL, never a reachable
      # one — nothing in this job connects to a database. Real credentials stay
      # in the deployment environment.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      # `next build` inlines NEXT_PUBLIC_* at build time, so the build needs a
      # placeholder present. It is not used to reach anything.
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_SUPABASE_SERVICE_ROLE_KEY: "placeholder"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, and fails if the
      # lockfile and package.json have drifted. postinstall runs prisma generate.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Errors block the build. Warnings do not — there are 11 today (mostly
      # <img> that wants converting to next/image, CLEANUP.md §8.4). Once those
      # are cleared, add `--max-warnings 0` here so they cannot creep back.
      - name: Lint
        run: npm run lint

      # Node-only unit tests: no database, no dev server. Covers the upload
      # sniffer, the role gate's 401/403 split and event status derivation.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Asserts that prisma/migrations and schema.prisma describe the same database,
  # so a schema edit cannot land without a migration behind it.
  #
  # Note what this does *not* cover: it never connects to the live database, and
  # `migrate diff` compares declarations rather than enum value order, so it will
  # not catch drift between the reconstructed baseline and production.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Fails if schema.prisma and the migration history have diverged — i.e.
      # somebody changed the schema without writing a migration for it.
      - name: Schema matches migration history
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://postgres:postgres@localhost:5432/shadow" \
            --exit-code

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
